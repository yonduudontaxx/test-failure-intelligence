name: CI

on:
  push:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfi
          POSTGRES_PASSWORD: tfi_dev_password
          POSTGRES_DB: tfi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tfi:tfi_dev_password@localhost:5432/tfi_test
      TEST_DATABASE_URL: postgresql://tfi:tfi_dev_password@localhost:5432/tfi_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Verify runtime flags
        id: runtime_flags
        run: |
          node --input-type=module -e "
            const fs = await import('node:fs');
            const { config } = await import('./dist/config.js');
            const testDb = new URL(process.env.TEST_DATABASE_URL);
            const database = testDb.host + testDb.pathname;
            console.log('config.nodeEnv=' + config.nodeEnv);
            console.log('TEST_DATABASE_URL database=' + database);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'node_env=' + config.nodeEnv + '\n' + 'database=' + database + '\n');
            if (config.nodeEnv !== 'test') { console.log('::error::config resolved NODE_ENV to ' + config.nodeEnv + ', expected test'); process.exit(1); }
            if (testDb.pathname !== '/tfi_test') { console.log('::error::TEST_DATABASE_URL points at ' + database + ', expected tfi_test'); process.exit(1); }
          "

      - run: npm run test:unit -- --json --outputFile=unit-results.json

      - run: npm run test:integration -- --json --outputFile=integration-results.json

      - name: Verify test suites ran
        id: test_counts
        run: |
          node --input-type=module -e "
            const fs = await import('node:fs');
            let failed = false;
            for (const suite of ['unit', 'integration']) {
              const r = JSON.parse(fs.readFileSync(suite + '-results.json', 'utf8'));
              console.log(suite + ': ' + r.numPassedTests + ' passed of ' + r.numTotalTests + ' tests');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, suite + '=' + r.numPassedTests + '/' + r.numTotalTests + '\n');
              if (r.numPassedTests < 1 || r.numFailedTests > 0) { console.log('::error::' + suite + ' suite passed ' + r.numPassedTests + ' of ' + r.numTotalTests + ' tests'); failed = true; }
            }
            if (failed) process.exit(1);
          "

      - name: Write Allure environment
        if: always()
        env:
          RUN_TRIGGER: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RT_NODE_ENV: ${{ steps.runtime_flags.outputs.node_env || 'not captured' }}
          RT_DATABASE: ${{ steps.runtime_flags.outputs.database || 'not captured' }}
          RT_UNIT: ${{ steps.test_counts.outputs.unit || 'not captured' }}
          RT_INTEGRATION: ${{ steps.test_counts.outputs.integration || 'not captured' }}
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties <<EOF
          Run.Trigger=$RUN_TRIGGER
          Run.Id=$RUN_ID
          Commit=$COMMIT
          Branch=$BRANCH
          Runtime.NODE_ENV=$RT_NODE_ENV
          Runtime.TestDatabase=$RT_DATABASE
          Tests.Unit.Passed=$RT_UNIT
          Tests.Integration.Passed=$RT_INTEGRATION
          Runtime.Node=$(node -v)
          EOF
          cat allure-results/environment.properties

      - name: Generate Allure report
        if: always()
        run: npx --yes allure-commandline generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-backend
          path: backend/allure-report
          retention-days: 30

  frontend:

    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Write Allure environment
        if: always()
        env:
          RUN_TRIGGER: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties <<EOF
          Run.Trigger=$RUN_TRIGGER
          Run.Id=$RUN_ID
          Commit=$COMMIT
          Branch=$BRANCH
          Runtime.Node=$(node -v)
          EOF
          cat allure-results/environment.properties

      - name: Generate Allure report
        if: always()
        run: npx --yes allure-commandline generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-frontend
          path: frontend/allure-report
          retention-days: 30

      - run: npm run build

  publish-reports:
    name: Publish Allure Reports
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: allure-report-backend
          path: site/backend

      - uses: actions/download-artifact@v7
        with:
          name: allure-report-frontend
          path: site/frontend

      - name: Create index page
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TFI Test Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 24px; }
              h1 { font-size: 1.5rem; margin-bottom: 8px; }
              p { color: #666; margin-bottom: 32px; }
              a { display: block; padding: 16px 20px; border: 1px solid #e2e8f0; border-radius: 8px; text-decoration: none; color: #0f172a; margin-bottom: 12px; }
              a:hover { background: #f8fafc; }
              a span { display: block; font-size: 0.85rem; color: #64748b; margin-top: 4px; }
            </style>
          </head>
          <body>
            <h1>Test Failure Intelligence — Allure Reports</h1>
            <p>Generated from the latest CI run on <strong>${{ github.ref_name }}</strong>.</p>
            <a href="backend/">Backend (Jest)
              <span>Unit and integration test results for the Fastify API</span>
            </a>
            <a href="frontend/">Frontend (Vitest)
              <span>Smoke test results for the Next.js dashboard</span>
            </a>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: false

      - name: Post report URL to summary
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          {
            echo "### Allure Test Reports"
            echo ""
            echo "| Suite | Link |"
            echo "|-------|------|"
            echo "| Backend (Jest) | [$PAGES_URL/backend/]($PAGES_URL/backend/) |"
            echo "| Frontend (Vitest) | [$PAGES_URL/frontend/]($PAGES_URL/frontend/) |"
          } >> "$GITHUB_STEP_SUMMARY"
